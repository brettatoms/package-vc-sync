name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs_version: [30.1, 31.1]
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}
      - name: Run tests
        run: emacs -Q --batch -L . -l test/package-vc-sync-test.el -f ert-run-tests-batch-and-exit
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@master
        with:
          version: 31.1
      - name: Install package-lint
        run: emacs -Q --batch --eval "(progn (require 'package)
                (add-to-list 'package-archives '(\"melpa\" . \"https://melpa.org/packages/\"))
                (package-refresh-contents) (package-install 'package-lint))"
      - name: package-lint
        run: emacs -Q --batch --eval "(progn (package-initialize) (require 'package-lint))" -f package-lint-batch-and-exit package-vc-sync.el
